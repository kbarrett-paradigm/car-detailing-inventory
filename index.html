<!DOCTYPE html>
    <html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">
    <!-- Makes site mobile-friendly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="normal" />
    <!-- Browser tab title -->
    <title>Kevin's Detailing Inventory</title>
    <!-- Connect CSS file -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Roboto">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <!-- Main page heading -->
    <header>
        <h1 style="text-align: center;">Kevin's Car Detailing Inventory</h1>
    </header>

    <!-- Dashboard statistics section -->
    <section class="stats">
        <!-- Total products card -->
        <div class="card">
            <h2 id="productCount">0</h2>
            <p><b>Total Products</b></p>
        </div>
        <!-- Inventory value card -->
        <div class="card">
            <h2 id="inventoryValue">$0</h2>
            <p><b>Inventory Value</b></p>
        </div>
        <!-- Low inventory card -->
        <div class="card">
            <h2 id="lowInventory">0</h2>
            <p><b>Low Inventory</b></p>
        </div>        
        <!-- Out of Stock card -->
        <div class="card">
            <h2 id="outStock">0</h2>
            <p><b>Out of Stock</b></p>
        </div>
    </section>

    <!-- Search box section -->
    <section class="search">
        <div>
        <input
            type="search"
            id="search"
            placeholder="Search inventory..."
        >
        </div>
    </section>


<!-- Trigger/Open The Modal -->
<section class="myBtn">
<button id="myBtn">Add Product</button>
</section>
<!-- The Modal -->
<div id="myModal" class="modal">

  <!-- Modal content -->
  <div class="modal-content">

    <span class="close">&times;</span>

    <div id="addProductForm" >

        <h2>Add New Product</h2>

        <!-- Category -->
        <label for="newCategory">
            Category:
        </label>

        <input
            type="text"
            id="newCategory"
            placeholder="Example: Wheel Cleaner"
        >
<br />
<br />
        <!-- Product Name -->
        <label for="newProductName">
            Product Name:
        </label>

        <input
            type="text"
            id="newProductName"
            placeholder="Example: Ultimate All Wheel Cleaner"
        >
<br />
<br />
        <!-- Brand -->
        <label for="newBrand">
            Brand:
        </label>

        <input
            type="text"
            id="newBrand"
            placeholder="Example:Meguiars"
        >
<br />
<br />
        <!-- Quantity -->
        <label for="newQuantity">
            Quantity (Bottles):
        </label>

        <input
            type="number"
            id="newQuantity"
            value="1"
            min="0"
        >
<br />
<br />
        <!-- Percent Remaining -->
        <label for="newPercent">
            Percent Remaining:
        </label>

        <input
            type="number"
            id="newPercent"
            value="100"
            min="0"
            max="100"
        >
<br />
<br />
        <!-- Purchase Price -->
        <label for="newPurchasePrice">
            Purchase Price:
        </label>

        <input
            type="number"
            id="newPurchasePrice"
            value="0"
            min="0"
            step="0.01"
        >
<br />
<br />
        <!-- Notes -->
        <label for="newNotes">
            Notes:
        </label>

        <textarea
            id="newNotes"
            placeholder="Optional notes about this product.">
        </textarea>
<br />
<br />
        <!-- Purchase Link -->
        <label for="newLink">
            Link:
        </label>

        <input
            type="url"
            id="newLink"
            placeholder="https://..."
        >

<br />

<br />
        <!-- Save button -->
        <button
            type="button"
            onclick="addNewProduct()">
            Save Product
        </button>
<br />
<br />
        <!-- Cancel button -->
        <button
            type="button"
            onclick="hideAddProductForm()">
            Cancel
        </button>

    </div>

  </div>

</div>


    <!-- Product cards section - get injected here by JavaScript... Nothing needs to be manually added here.
        Example:
        Brake Buster
        Green Star
        ONR
    -->
    <section id="products"></section>

    <!-- DEBUG PANEL - Shows connection status and troubleshooting info -->
    <section id="debug"></section>

    <!-- Load JavaScript AFTER page loads -->
    <script src="app.js"></script>

</body>
</html>
