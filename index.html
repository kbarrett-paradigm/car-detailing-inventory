<!DOCTYPE html>
    <html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">
    <!-- Makes site mobile-friendly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="normal" />
    <!-- Browser tab title -->
    <title>Kevin's Detailing Inventory</title>
    <!-- Connect CSS file -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Roboto">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <!-- Main page heading -->
    <header>
        <h1 style="text-align: center;">Kevin's Car Detailing Inventory</h1>
    </header>

    <!-- Dashboard statistics section -->
    <section class="stats">
        <!-- Total products card -->
        <div class="card">
            <h2 id="productCount">0</h2>
            <p><b>Total Products</b></p>
        </div>
        <!-- Inventory value card -->
        <div class="card">
            <h2 id="inventoryValue">$0</h2>
            <p><b>Inventory Value</b></p>
        </div>
        <!-- Low inventory card -->
        <div class="card">
            <h2 id="lowInventory">0</h2>
            <p><b>Low Inventory</b></p>
        </div>        
        <!-- Out of Stock card -->
        <div class="card">
            <h2 id="outStock">0</h2>
            <p><b>Out of Stock</b></p>
        </div>
    </section>

    <!-- Search box section -->
    <section class="search">
        <div>
        <input
            type="search"
            id="search"
            placeholder="Search inventory..."
        >
        </div>
    </section>

    <!-- Product cards section - get injected here by JavaScript... Nothing needs to be manually added here.
        Example:
        Brake Buster
        Green Star
        ONR
    -->
    <section id="products"></section>

    <!-- DEBUG PANEL - Shows connection status and troubleshooting info -->
    <section id="debug"></section>

    <!-- Load JavaScript AFTER page loads -->
    <script src="app.js"></script>

</body>
</html>
